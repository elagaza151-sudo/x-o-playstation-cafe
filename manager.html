<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>x/o – لوحة التشغيل</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C3A36;--card:#124843;--card2:#0f403b;--ink:#F3F7F5;--muted:#9DBFB8;--line:rgba(255,255,255,.16);--pop:#FFD23F;--popink:#1E1B00;--ok:#3DDC97;--bad:#FF6B7D;--hd:#0A302d;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#E4EFEA;--card:#fff;--card2:#F2F8F5;--ink:#0C3A36;--muted:#47706a;--line:rgba(12,58,54,.2);--ok:#12875a;--bad:#C93049;--hd:#D3E5DE;color-scheme:light}}
:root[data-theme="light"]{--bg:#E4EFEA;--card:#fff;--card2:#F2F8F5;--ink:#0C3A36;--muted:#47706a;--line:rgba(12,58,54,.2);--ok:#12875a;--bad:#C93049;--hd:#D3E5DE;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Rubik,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:26px;direction:ltr}.logo i{color:var(--pop);font-style:normal}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}
nav button{font:700 15px Rubik;padding:8px 16px;border-radius:999px;border:2px solid transparent;background:none;color:var(--ink);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--pop);color:var(--popink)}
.clock{font-weight:700;color:var(--muted);direction:ltr}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{margin:0 0 14px;font-size:24px;font-weight:900}
h3{margin:0;font-size:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.room.busy{border:2px solid var(--pop)}
.room.soon{border:2px dashed var(--bad)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.on{background:var(--pop);color:var(--popink);border-color:var(--pop)}
.tm{font:900 38px/1.1 Rubik;direction:ltr;text-align:right;letter-spacing:.02em;margin:8px 0 2px}
.cs{font-weight:900;color:var(--pop);font-size:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.muted{color:var(--muted);font-size:14px}
.btn{font:700 15px Rubik;border:0;border-radius:9px;padding:9px 16px;background:var(--pop);color:var(--popink);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:4px 12px;font-size:14px}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:var(--card2);color:var(--ink);min-width:0;width:100%}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:14px}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat b{display:block;font-size:26px;font-weight:900}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
.line.done{opacity:.45;text-decoration:line-through}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(480px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.items button{text-align:start;font:500 14px Rubik;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer}
.items button:active{transform:scale(.97)}
#toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--pop);color:var(--popink);font-weight:700;padding:10px 20px;border-radius:10px;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Motion polish: subtle, on-brand, and respectful of reduced-motion settings */
@keyframes xoFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes xoSoftGlow{0%,100%{box-shadow:0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 22px rgba(255,210,63,.10)}}
@keyframes xoPulseDot{0%,100%{opacity:1}50%{opacity:.65}}
body{animation:xoFadeUp .42s ease-out both}
header,nav{animation:xoFadeUp .45s ease-out both}
#main>.card,#main>.two,#main>section,.card{animation:xoFadeUp .42s ease-out both}
.card,.line,.items button{transition:transform .2s ease,box-shadow .22s ease,border-color .22s ease,background-color .22s ease}
.card:hover{box-shadow:0 10px 26px rgba(0,0,0,.13);border-color:rgba(255,210,63,.25)}
button,.btn,nav button{transition:transform .16s ease,filter .2s ease,box-shadow .2s ease}
button:hover,.btn:hover,nav button:hover{filter:brightness(1.06)}
button:active,.btn:active{transform:scale(.975)}
nav button[aria-selected=true]{box-shadow:0 4px 16px rgba(255,210,63,.15)}
.tag{animation:xoPulseDot 3s ease-in-out infinite}
#toast.on{animation:xoFadeUp .25s ease-out both}

@media (prefers-reduced-motion:reduce){body,header,nav,.card,.logo,.tag,#toast.on{animation:none!important}*,*::before,*::after{transition:none!important}}

/* Extra Wave motion pack */
:root{scroll-behavior:smooth}
body{animation:waveAmbient 14s ease-in-out infinite alternate}
@keyframes waveAmbient{0%{background-position:0% 0%}100%{background-position:100% 40%}}
header,.hero,.top,.brand,.logo{animation:waveDrop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes waveDrop{from{opacity:0;transform:translateY(-18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.card,.room,.room-card,.booking-card,.stat,.panel{animation:waveRise .65s cubic-bezier(.16,1,.3,1) both;transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
@keyframes waveRise{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover,.room:hover,.room-card:hover,.booking-card:hover,.stat:hover,.panel:hover{transform:translateY(-5px);box-shadow:0 14px 32px #0003,0 0 0 1px #FFD23F35;border-color:#FFD23F88}
button,.btn,a.button{position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .25s ease,filter .25s ease}
button:hover,.btn:hover,a.button:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 7px 18px #0003,0 0 16px #FFD23F30}
button:active,.btn:active,a.button:active{transform:scale(.96)}
button::after,.btn::after,a.button::after{content:"";position:absolute;top:-80%;left:-70%;width:42%;height:260%;transform:rotate(22deg);background:linear-gradient(90deg,transparent,#ffffff45,transparent);transition:left .65s ease;pointer-events:none}
button:hover::after,.btn:hover::after,a.button:hover::after{left:140%}
input,select,textarea{transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:#FFD23F!important;box-shadow:0 0 0 3px #FFD23F26,0 0 18px #FFD23F15;transform:translateY(-1px)}
.logo{animation:logoPulse 4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 0 #FFD23F00)}50%{filter:drop-shadow(0 0 10px #FFD23F80)}}
.tag,.badge,.status{animation:tagGlow 3s ease-in-out infinite}
@keyframes tagGlow{0%,100%{box-shadow:0 0 0 #FFD23F00}50%{box-shadow:0 0 12px #FFD23F28}}
tr{transition:background .2s ease}
tbody tr:hover,tr:hover{background:#FFD23F0D}
nav button[aria-selected="true"]{animation:activeTab .35s ease both;box-shadow:0 0 0 1px #FFD23F55,0 5px 18px #FFD23F16}
@keyframes activeTab{from{transform:scale(.96)}to{transform:scale(1)}}
#toast.on{animation:toastPop .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes toastPop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
/* Keep animation tasteful and respect accessibility settings */
@media(prefers-reduced-motion:reduce){body,header,.hero,.top,.brand,.logo,.card,.room,.room-card,.booking-card,.stat,.panel,.tag,.badge,.status,#toast.on{animation:none!important}*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}


/* X/O opening sequence + one-by-one icon entrance */
#xo-intro{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#0C3A36;color:#F3F7F5;pointer-events:none;animation:xoIntroOut .75s ease 1.25s forwards}
#xo-intro .mark{direction:ltr;font:900 clamp(76px,18vw,150px)/1 Rubik,Tahoma,sans-serif;letter-spacing:-.08em;display:flex;gap:.04em;align-items:center}
#xo-intro .mark span{display:inline-block;opacity:0;animation:xoMarkIn .55s cubic-bezier(.16,1,.3,1) forwards}
#xo-intro .mark span:nth-child(1){animation-delay:.12s}#xo-intro .mark span:nth-child(2){color:#FFD23F;animation-delay:.32s}#xo-intro .mark span:nth-child(3){animation-delay:.52s}
#xo-intro .line{position:absolute;bottom:calc(50% - 100px);width:min(190px,45vw);height:3px;border-radius:9px;background:linear-gradient(90deg,transparent,#FFD23F,transparent);transform:scaleX(0);transform-origin:center;animation:xoLine .65s .62s ease forwards}
@keyframes xoMarkIn{from{opacity:0;transform:translateY(35px) scale(.65) rotate(-12deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes xoLine{to{transform:scaleX(1)}}
@keyframes xoIntroOut{to{opacity:0;visibility:hidden}}
.xo-icon-pop{display:inline-block;transform-origin:center;animation:xoIconIn .48s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--xo-delay,0ms)}
@keyframes xoIconIn{from{opacity:0;transform:translateY(12px) scale(.35) rotate(-18deg);filter:blur(3px)}65%{opacity:1;transform:translateY(-3px) scale(1.16) rotate(5deg);filter:blur(0)}to{opacity:1;transform:none}}
.xo-stagger-in{animation:xoFadeUp .55s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--xo-delay,0ms)}
@media(prefers-reduced-motion:reduce){#xo-intro{display:none}.xo-icon-pop,.xo-stagger-in{animation:none!important}}

</style>
</head>
<body>
<div id="xo-intro" aria-hidden="true"><div class="mark"><span>x</span><span>/</span><span>o</span></div><div class="line"></div></div>

<header><div class="top"><span class="logo">x<i>/</i>o</span><nav id="nav"></nav><span class="clock" id="clk"></span></div></header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/manager-cloud.js"></script>
<script src="js/notifications.js"></script>
<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return Math.round(n).toLocaleString("en-US")}
function p2(n){return(n<10?"0":"")+n}
function fmt(ms){var s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)}
var K="xo_ops_v1",S,view="rooms",range="day",ck=null;
function seed(){return{nid:100,round:15,walk:[],sales:[],exp:[],bk:[],
 rooms:[{id:1,n:"غرفة VIP",rate:120},{id:2,n:"غرفة VIP 2",rate:120},{id:3,n:"غرفة VIP 3",rate:120},{id:4,n:"غرفة عائلية",rate:90},{id:5,n:"غرفة عائلية 2",rate:90},{id:6,n:"الصالة المفتوحة",rate:50},{id:7,n:"الصالة 2",rate:50},{id:8,n:"الصالة 3",rate:50},{id:9,n:"غرفة VIP 4",rate:120},{id:10,n:"الصالة 4",rate:50},{id:11,n:"غرفة عائلية 3",rate:90},{id:12,n:"الصالة 5",rate:50}],
 accounts:[],
 menu:[["قهوة تركي",35],["إسبريسو",40],["كابتشينو",55],["لاتيه",58],["فلات وايت",62],["نسكافيه",40],["آيس لاتيه",65],["آيس موكا",70],["كولد برو",68],["موهيتو",55],["ريد بول",60],["مياه معدنية",15],["عصير مانجا",55],["فراولة بالحليب",55],["ليمون بالنعناع",45],["سموذي ميكس بيري",70],["ميلك شيك أوريو",75],["كوكتيل فواكه",65],["ساندوتش بيتزا",80],["برجر لحمة",120],["تشيكن كرسبي",95],["باستا ألفريدو",110],["ناتشوز بالجبنة",65],["هوت دوج",70],["بطاطس مقلية",45],["بوب كورن",30],["وافل نوتيلا",75],["كوكيز دافية",60],["براونيز",50],["تشيز كيك",70]]}}
function load(){try{var j=localStorage.getItem(K);if(j)return JSON.parse(j)}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S));if(window.xoManagerCloud&&currentUser)window.xoManagerCloud.savePos(S).catch(function(e){console.error(e);toast("تعذر الحفظ على الخادم")})}catch(e){toast("تعذر الحفظ")}}
S=load();
window.xoManagerGetState=function(){return S};
window.xoManagerApplyState=function(remote){if(remote&&typeof remote==="object"){S=Object.assign(seed(),remote);delete S.accounts;if(!Array.isArray(S.rooms))S.rooms=seed().rooms;if(!Array.isArray(S.menu))S.menu=seed().menu;if(!Array.isArray(S.sales))S.sales=[];if(!Array.isArray(S.exp))S.exp=[];if(!Array.isArray(S.bk))S.bk=[];if(!Array.isArray(S.walk))S.walk=[];}};
if(!S.rooms)S.rooms=seed().rooms;
[{id:6,n:"VIP 3",rate:120},{id:7,n:"صالة 3",rate:50},{id:8,n:"عائلية 2",rate:90},{id:9,n:"VIP 4",rate:120},{id:10,n:"صالة 4",rate:50},{id:11,n:"عائلية 3",rate:90},{id:12,n:"صالة 5",rate:50}].forEach(function(r){if(!S.rooms.some(function(x){return x.id===r.id}))S.rooms.push(r)});
delete S.accounts;
var currentUser=null;
function activeShift(){return currentUser?(currentUser.role==="مدير"?"الإدارة":(currentUser.shift||"شيفت 1")):"غير محدد"}
function loginView(){
 $("nav").style.display="none";
 $("main").innerHTML="<div class='card' style='max-width:440px;margin:8vh auto'><div class='logo' style='text-align:center;margin-bottom:12px'>x<i>/</i>o</div><h2 style='text-align:center'>تسجيل الدخول</h2><p class='muted' style='text-align:center'>سجل باسم المستخدم وكلمة المرور المخصصة لك</p><div class='form' style='grid-template-columns:1fr'><label>اسم المستخدم<input id='loginUsername' type='text' autocomplete='username' autocapitalize='none' spellcheck='false' placeholder='admin أو shift1'></label><label>كلمة المرور<input id='loginPass' type='password' autocomplete='current-password'></label><button class='btn' data-a='login'>دخول</button><p class='muted'>الحسابات تُدار من Supabase Auth، ولا توجد كلمات مرور افتراضية داخل الموقع.</p></div></div>";
}
function id(){return S.nid++}
function room(i){return S.rooms.filter(function(r){return r.id==i})[0]}
function cost(r,ms){var b=Math.max(1,Math.ceil(ms/60000/S.round));return Math.round(b*S.round/60*r.rate)}
function sum(o){return o.reduce(function(a,l){return a+l.p*l.q},0)}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1800)}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function mins(t){var a=t.split(":");return a[0]*60+Number(a[1])}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
var TABS=[["rooms","الغرف"],["bk","الحجوزات"],["webbk","طلبات الموقع"],["cafe","الكافيه"],["inventory","الجرد 📦"],["acc","الحسابات"],["set","الإعدادات"],["tournaments","البطولات 🏆"],["admin","المدير"]];
function nav(){
 if(!currentUser){$("nav").style.display="none";return}
 $("nav").style.display="flex";
 var allowed=currentUser.role==="مدير"?TABS:TABS.filter(function(t){return ["rooms","bk","webbk","cafe","inventory","acc"].indexOf(t[0])>=0});
 $("nav").innerHTML=allowed.map(function(t){return"<button data-a='tab' data-v='"+t[0]+"' aria-selected='"+(view==t[0])+"'>"+t[1]+"</button>"}).join("")+"<button data-a='logout' class='g'>خروج ("+esc(currentUser.shift||"مدير")+")</button>";
}
function nextBk(r){var d=today(),n=nowMin();return S.bk.filter(function(b){return b.r==r.id&&b.d==d&&mins(b.tm)+b.h*60>n}).sort(function(a,b){return mins(a.tm)-mins(b.tm)})[0]}
/* ---- views ---- */
function vRooms(){
 var h="<h2>الغرف</h2><div class='grid'>";
 S.rooms.forEach(function(r){var s=r.ss,nb=nextBk(r),soon=nb&&mins(nb.tm)-nowMin()<=30&&!s;
  h+="<div class='card room"+(s?" busy":"")+(soon?" soon":"")+"' data-rs='"+r.id+"'><div class='row sp'><h3>"+esc(r.n)+"</h3><span class='tag"+(s?" on":"")+"'>"+(s?"شغالة":"فاضية")+"</span></div><div class='muted'>"+money(r.rate)+" جنيه / ساعة</div>";
  if(s){h+="<div class='tm'>"+fmt(Date.now()-s.s)+"</div><div class='row sp'><span class='cs'>"+money(cost(r,Date.now()-s.s))+"</span><span class='muted'>جنيه وقت</span></div><div class='muted'>"+(s.c?esc(s.c)+" · ":"")+"كافيه: "+money(sum(s.o))+" جنيه ("+s.o.length+" طلب)</div><div class='row' style='margin-top:12px'><button class='btn g' data-a='addc' data-r='"+r.id+"'>+ كافيه</button><button class='btn' data-a='end' data-r='"+r.id+"'>إنهاء وحساب</button><button class='btn r' data-a='cancelstart' data-r='"+r.id+"'>إلغاء فتح الغرفة</button></div>"}
  else{if(nb)h+="<div class='muted' style='margin:8px 0'>حجز "+nb.tm+" – "+esc(nb.n)+"</div>";
   h+="<div class='row' style='margin-top:12px'><input id='n"+r.id+"' placeholder='اسم الزبون (اختياري)'><button class='btn' data-a='start' data-r='"+r.id+"'>ابدأ</button></div>"}
  h+="</div>"});

<script>
(function(){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){var intro=document.getElementById('xo-intro');if(intro)intro.remove();return;}
  var emojiRE=/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu;
  function animateIcons(){
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentElement&&!n.parentElement.closest('script,style,textarea,input,select,option,code,pre,.xo-icon-pop')&&emojiRE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
    var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(node){var value=node.nodeValue;emojiRE.lastIndex=0;var frag=document.createDocumentFragment(),last=0,m,index=0;while((m=emojiRE.exec(value))){if(m.index>last)frag.appendChild(document.createTextNode(value.slice(last,m.index)));var span=document.createElement('span');span.className='xo-icon-pop';span.style.setProperty('--xo-delay',(index++*95)+'ms');span.textContent=m[0];frag.appendChild(span);last=m.index+m[0].length;}if(last<value.length)frag.appendChild(document.createTextNode(value.slice(last)));node.parentNode.replaceChild(frag,node);});
  }
  function staggerSections(){var els=document.querySelectorAll('nav a,nav button,.cta .btn,.room,.item,.toolcard,.tourcard,.card,.stat');els.forEach(function(el,i){if(!el.classList.contains('xo-icon-pop')){el.classList.add('xo-stagger-in');el.style.setProperty('--xo-delay',Math.min(i,16)*65+'ms');}})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){animateIcons();staggerSections();});else{animateIcons();staggerSections();}
  window.addEventListener('pageshow',function(e){if(e.persisted){var intro=document.getElementById('xo-intro');if(intro)intro.remove();}});
})();
</script>
